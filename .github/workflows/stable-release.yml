name: Stable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          version=${tag#v}
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          schema=$(sed -n 's/^const nativeCoreSchemaVersion = \([0-9][0-9]*\)$/\1/p' go/core_schema.go)
          test -n "$schema"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"

      - name: Check deployment rollback failure paths
        run: python3 scripts/test-deploy.py

      - name: Race-check critical regressions
        run: docker build --target verify-race --progress plain .

      - name: Build verified release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/erdai-release"
          sh scripts/build-release.sh \
            "${{ steps.metadata.outputs.version }}" \
            "${{ steps.metadata.outputs.schema }}" \
            "$RUNNER_TEMP/erdai-release"
          sha256sum "$RUNNER_TEMP/erdai-release/erdai-agent-stable-${{ steps.metadata.outputs.version }}.tar.gz"

      - name: Publish Stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ARCHIVE: ${{ runner.temp }}/erdai-release/erdai-agent-stable-${{ steps.metadata.outputs.version }}.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "ErDai Agent $TAG" --generate-notes
          fi
          gh release upload "$TAG" "$ARCHIVE" --clobber
