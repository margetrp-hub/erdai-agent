name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build WebUI and run Go tests and vet
        run: docker build --target verify --progress plain .
      - name: Check deployment rollback failure paths
        run: python3 scripts/test-deploy.py
      - name: Verify restricted video inspection worker
        run: |
          docker build --tag erdai-media-check:verify media-check
          docker run --rm --network none --read-only \
            --memory 128m --memory-swap 192m --cpus 0.75 --pids-limit 32 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=16m,noexec,nosuid \
            --mount "type=bind,source=$PWD/media-check/test_server.py,target=/app/test_server.py,readonly" \
            erdai-media-check:verify python -m unittest -v test_server
      - name: Smoke-test isolated release image
        run: |
          docker build --tag erdai-agent:verify --progress plain .
          version=$(sed -n 's/^const erdaiRuntimeVersion = "\([0-9][0-9.]*\)"$/\1/p' go/version.go)
          schema=$(sed -n 's/^const nativeCoreSchemaVersion = \([0-9][0-9]*\)$/\1/p' go/core_schema.go)
          python3 scripts/test-release-smoke.py --image erdai-agent:verify --version "$version" --schema "$schema"
      - name: Race-check recovery, delivery, points and agent optimization
        run: docker build --target verify-race --progress plain .
