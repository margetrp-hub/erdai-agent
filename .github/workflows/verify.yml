name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build WebUI and run Go tests and vet
        run: docker build --target verify --progress plain .
      - name: Check deployment rollback failure paths
        run: python3 scripts/test-deploy.py
      - name: Race-check recovery, delivery and points regressions
        run: docker build --target verify-race --progress plain .
