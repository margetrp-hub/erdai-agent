<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>二呆智能体 · Companion</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/companion.css">
</head>
<body>
  <main class="companion-shell">
    <header class="companion-head">
      <div class="identity"><img src="/favicon.svg" alt=""><div><strong id="persona">二呆智能体</strong><span id="state">等待配对</span></div></div>
      <button id="settings" class="icon-button" type="button" title="设备设置" aria-label="设备设置">⚙</button>
    </header>
    <section id="pairing" class="pairing-panel">
      <h1>连接你的智能体</h1>
      <p>在 Core 后台生成一次性配对码。</p>
      <form id="pair-form">
        <label><span>设备名称</span><input id="device-name" maxlength="80" value="我的桌面" required></label>
        <label><span>配对码</span><input id="pair-code" maxlength="64" autocomplete="one-time-code" required></label>
        <button type="submit">连接</button>
      </form>
      <p id="pair-error" class="error" hidden></p>
    </section>
    <section id="conversation" class="conversation" hidden>
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="composer" class="composer">
        <textarea id="message" rows="1" maxlength="4000" placeholder="说点什么…" required></textarea>
        <button id="voice" class="icon-button" type="button" title="语音输入" aria-label="语音输入">●</button>
        <button class="send" type="submit" title="发送" aria-label="发送">↑</button>
      </form>
    </section>
  </main>
  <script type="module" src="/companion.js"></script>
</body>
</html>
